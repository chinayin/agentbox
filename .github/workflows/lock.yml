# Weekly `make lock`: plain `mise lock --bump`, then a PR when the lock files changed. The lock is the image's only source of versions.
#
# A branch pushed with the default GITHUB_TOKEN does not trigger pull_request events, so ci.yml
# would not run on the PR by itself. workflow_dispatch is exempt from that recursion guard: the
# last step dispatches ci.yml on the PR branch, which needs `actions: write`. No PAT involved.
name: lock

on:
  workflow_dispatch:
  schedule:
    # Every Monday 02:00 UTC
    - cron: "0 2 * * 1"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: lock
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read required mise version
        id: mise
        # mise.toml's min_version is the single source; nothing is hardcoded in this workflow
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("mise.toml","rb"))["min_version"])')" >> "$GITHUB_OUTPUT"

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          version: ${{ steps.mise.outputs.version }}
          install: false
          cache: false

      - name: Regenerate lock files
        env:
          # Only used for GitHub API version resolution; no extra scopes required
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make lock

      - name: Gate
        run: make test

      - name: Summarize changes
        id: summary
        run: |
          if git diff --quiet -- mise.lock mise.claude.lock mise.pi.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "lock files unchanged"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<EOF'
            echo 'Generated by the lock workflow. Version changes:'
            echo
            echo '```'
            git diff -U0 -- mise.lock mise.claude.lock mise.pi.lock | grep -E '^[-+]version = ' | sed 's/^-version = /- /; s/^+version = /+ /'
            echo '```'
            echo
            echo 'Review: versions look as expected; every platform entry carries a URL; ci.yml builds the images after merge.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        if: steps.summary.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/mise-lock
          delete-branch: true
          add-paths: |
            mise.lock
            mise.claude.lock
            mise.pi.lock
          commit-message: "chore: update mise lock"
          title: "chore: update mise lock"
          body: ${{ steps.summary.outputs.body }}
          labels: dependencies

      - name: Run ci.yml on the PR branch
        # Only when the branch actually moved; an unchanged branch already has its CI result.
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref chore/mise-lock
