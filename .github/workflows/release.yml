# Release: a vX.Y.Z tag publishes multi-arch images to GHCR, and only after ci.yml is green.
#
# The version has a single source of truth: the git tag. v1.2.3 -> ghcr.io/<repo>:1.2.3 and :1.2.3-pi.
# No git-sha tags, no `latest`, no image for main: running instances pin a version, and a floating
# tag makes "which host runs which build" unanswerable. Re-pushing the same tag re-runs this
# workflow and overwrites the same image tag; that is a deliberate operator action, not CI drift.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One publish per tag at a time; a re-pushed tag waits for the previous run instead of racing it.
# Literal prefix, matching ci.yml: the two groups must never collide or the called ci job deadlocks
# against this run. See the comment in ci.yml.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  # Build cache. type=gha is unusable here: Actions cache is scoped to the ref that wrote it plus
  # the default branch, so a cache written by refs/tags/vX.Y.Z can never be read by the next tag,
  # and ci.yml writes none for main to fall back on. v0.1.0 uploaded 1.59 GB nothing would ever
  # read. A registry ref is ref-agnostic. It lives in its own package rather than as a tag on the
  # image so that agentbox lists only real versions once it goes public -- this one can stay
  # private. Measured payoff: the apt layer alone is 350s of emulated arm64 per cold build, and it
  # is invalidated only by a Dockerfile edit, not by a lock bump.
  CACHE: ghcr.io/${{ github.repository }}-buildcache

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish multi-arch images to GHCR
    needs: ci
    runs-on: ubuntu-latest
    # A ceiling against a hung build, not a budget. Measured on the v0.1.0 cold run (34254147750):
    # 13m30s, of which the emulated arm64 apt layer alone was 350s (6.2x its native 57s) and the
    # dead gha cache export another 165s. With that export replaced by a registry cache a cold run
    # should land near 11 min and a warm one far below; 20 keeps headroom for the cold case. A trip
    # here is recoverable: re-pushing the tag re-runs this workflow and overwrites the same tag.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive version from git tag
        id: version
        # v1.2.3 -> 1.2.3; anything that is not vX.Y.Z fails fast instead of publishing "vfoo"
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Error: tag ${GITHUB_REF_NAME} is not of the form vX.Y.Z" >&2; exit 1 ;;
          esac
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Push agentbox:<version>
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agentbox-claude
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            AGENTBOX_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.CACHE }}:claude
          # ignore-error: a registry hiccup must warn, never fail a release that already built.
          cache-to: type=registry,ref=${{ env.CACHE }}:claude,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Push agentbox:<version>-pi
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agentbox-pi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-pi
          build-args: |
            AGENTBOX_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.CACHE }}:pi
          cache-to: type=registry,ref=${{ env.CACHE }}:pi,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
