# Release: a vX.Y.Z tag publishes images to GHCR, and only after ci.yml is green.
#
# The version has a single source of truth: the git tag. v1.2.3 -> ghcr.io/<repo>:1.2.3 and :1.2.3-pi.
# No git-sha tags, no `latest`, no image for main: running instances pin a version, and a floating
# tag makes "which host runs which build" unanswerable. Re-pushing the same tag re-runs this
# workflow and overwrites the same image tag; that is a deliberate operator action, not CI drift.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One publish per tag at a time; a re-pushed tag waits for the previous run instead of racing it.
# Literal prefix, matching ci.yml: the two groups must never collide or the called ci job deadlocks
# against this run. See the comment in ci.yml.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  # Build cache. type=gha is unusable here: Actions cache is scoped to the ref that wrote it plus
  # the default branch, so a cache written by refs/tags/vX.Y.Z can never be read by the next tag,
  # and ci.yml writes none for main to fall back on. v0.1.0 uploaded 1.59 GB nothing would ever
  # read. A registry ref is ref-agnostic, and it lives in its own package so agentbox lists only
  # real version tags. Measured payoff: the apt layer alone is 350s of emulated arm64 per cold
  # build, and it is invalidated only by a Dockerfile edit, not by a lock bump.
  #
  # One shared ref, not one per variant: the two variants differ by a single tool and share the
  # whole toolchain, so per-variant refs would store that bulk twice. docker-bake.hcl writes it
  # from the claude target alone -- one writer, no concurrent pushes racing for the same ref.
  CACHE: ghcr.io/${{ github.repository }}-buildcache:shared

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish images to GHCR
    needs: ci
    runs-on: ubuntu-latest
    # A ceiling against a hung build, not a budget. Measured on the v0.1.0 cold run (34254147750):
    # 13m30s, of which the emulated arm64 apt layer alone was 350s (6.2x its native 57s) and the
    # dead gha cache export another 165s. With that export replaced by a registry cache a cold run
    # should land near 11 min and a warm one far below; 20 keeps headroom for the cold case. A trip
    # here is recoverable: re-pushing the tag re-runs this workflow and overwrites the same tag.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive version from git tag
        id: version
        # v1.2.3 -> 1.2.3; anything that is not vX.Y.Z fails fast instead of publishing "vfoo"
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Error: tag ${GITHUB_REF_NAME} is not of the form vX.Y.Z" >&2; exit 1 ;;
          esac
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve the build cache
        id: cache
        # Only cache while the package is public, where GHCR storage is free and unlimited. Private
        # packages count against the account's Packages quota (2 GB on Pro, shared by every private
        # package); going over is refused, and ignore-error turns that into a silent no-op rather
        # than a visible failure. Better to build cold and say so.
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            echo "ref=${CACHE}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "Warning: repository is private, building without a cache to stay inside the Packages quota" >&2
          fi

      - name: Build and push both images
        # The same command a developer runs locally, with --push instead of --load. Targets,
        # platforms and build args all come from docker-bake.hcl, so this file, the Makefile and
        # ci.yml cannot drift apart. -f is required: without it bake also reads docker-compose.yaml,
        # whose env_file is gitignored.
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.version.outputs.version }}
          # amd64 only. This line flipped three times on 2026-09-09; the measurements that settled
          # it, all from real runs: amd64 alone publishes in 2m12s cold and 1m17s warm, while adding
          # arm64 costs 334s of emulated apt for 7m50s total. That is 6x the wall clock and a 2x
          # cache (776 MB -> 1523 MB) for an architecture with no deployment target -- a developer
          # Mac can pull v0.3.0, which keeps its arm64 layers, or build natively with make image.
          # Re-enable by adding linux/arm64 here; the lock still carries arm64 URLs (test.sh pins
          # that), so nothing else has to change.
          PLATFORMS: linux/amd64
          CACHE_FROM: ${{ steps.cache.outputs.ref }}
          CACHE_TO: ${{ steps.cache.outputs.ref }}
        run: docker buildx bake -f docker-bake.hcl --push
