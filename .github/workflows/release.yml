# Release: a vX.Y.Z tag publishes multi-arch images to GHCR, and only after ci.yml is green.
#
# The version has a single source of truth: the git tag. v1.2.3 -> ghcr.io/<repo>:1.2.3 and :1.2.3-pi.
# No git-sha tags, no `latest`, no image for main: running instances pin a version, and a floating
# tag makes "which host runs which build" unanswerable. Re-pushing the same tag re-runs this
# workflow and overwrites the same image tag; that is a deliberate operator action, not CI drift.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One publish per tag at a time; a re-pushed tag waits for the previous run instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish multi-arch images to GHCR
    needs: ci
    runs-on: ubuntu-latest
    # A ceiling against a hung build, not a budget. Baseline: ci.yml builds both images on native
    # amd64 cold in ~2 min (run 34114631257). This job adds the emulated arm64 half and the gha
    # cache export, neither of which has been measured yet -- read the real duration off the first
    # v* run and tighten from there. A trip here is recoverable: re-pushing the tag re-runs this.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive version from git tag
        id: version
        # v1.2.3 -> 1.2.3; anything that is not vX.Y.Z fails fast instead of publishing "vfoo"
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Error: tag ${GITHUB_REF_NAME} is not of the form vX.Y.Z" >&2; exit 1 ;;
          esac
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Push agentbox:<version>
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agentbox-claude
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            AGENTBOX_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push agentbox:<version>-pi
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agentbox-pi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-pi
          build-args: |
            AGENTBOX_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
